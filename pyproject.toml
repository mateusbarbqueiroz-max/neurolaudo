[project]
name = "neurolaudo"
version = "0.1.0"
description = "Visualizador DICOM e editor de laudos dedicado à neurorradiologia"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "pydicom>=2.4", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
neurolaudo = "neurolaudo.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neurolaudo*"]
