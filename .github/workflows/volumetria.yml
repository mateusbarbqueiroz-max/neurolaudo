name: Volumetria (teste real)

# Instala o motor de volumetria com o mesmo instalador do usuário e roda a
# segmentação de verdade em um exame PÚBLICO (voluntário IXI002, CC BY-SA 3.0).
# Compara os volumes com os publicados pelo Neurodesk para o mesmo exame.
# Acionado à mão. Nenhum dado de paciente.

on:
  workflow_dispatch:
    inputs:
      onde:
        description: "linux (8 voluntários), miniatura (recorte em Linux e Mac), ambos ou diagnostico"
        default: "linux"

permissions:
  contents: write

env:
  # Voluntários do banco público IXI, na ordem em que aparecem no arquivo (dois hospitais).
  SUJEITOS: >-
    IXI002-Guys-0828-T1 IXI012-HH-1211-T1 IXI013-HH-1212-T1 IXI014-HH-1236-T1
    IXI015-HH-1258-T1 IXI016-Guys-0697-T1 IXI017-Guys-0698-T1 IXI019-Guys-0702-T1
  SUJEITO: IXI002-Guys-0828-T1
  IDADE: "35.8"
  SEXO: F

jobs:
  linux:
    if: inputs.onde == 'linux' || inputs.onde == 'ambos'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o motor de volumetria
        run: |
          export NEUROLAUDO_MOTOR="$RUNNER_TEMP/motor"
          echo "NEUROLAUDO_MOTOR=$NEUROLAUDO_MOTOR" >> "$GITHUB_ENV"
          time NEUROLAUDO_FONTE="$GITHUB_WORKSPACE/engine" bash mac/instalar-volumetria.sh
          du -sh "$NEUROLAUDO_MOTOR"

      - name: Baixar os T1 públicos
        run: |
          mkdir -p "$RUNNER_TEMP/ixi" && cd "$RUNNER_TEMP/ixi"
          # O arquivo é um .tar de 4,5 GB em ordem alfabética; lê só até achar os primeiros exames.
          curl -sL --max-time 900 http://biomedic.doc.ic.ac.uk/brain-development/downloads/IXI/IXI-T1.tar \
            | tar -xf - --occurrence=1 $(for s in $SUJEITOS; do printf '%s.nii.gz ' "$s"; done) || true
          ls -la
          test "$(ls *.nii.gz | wc -l)" -ge 1

      - name: Rodar a volumetria e comparar com os volumes publicados
        run: |
          nproc; free -g | head -2
          # O Linux recusa pedidos grandes de memória mesmo quando só uma parte seria usada, e o TensorFlow
          # sem oneDNN faz um pedido assim (uso real medido: 7 GB). O macOS não recusa; aqui fica igual a ele.
          sudo sysctl -w vm.overcommit_memory=1
          /usr/bin/time -v "$NEUROLAUDO_MOTOR/venv/bin/python" engine/scripts/validate_ixi.py \
            "$RUNNER_TEMP/ixi" engine/tests/data/brainquant_ixi_volumes.csv "$RUNNER_TEMP/saida" \
            2> "$RUNNER_TEMP/tempo.txt" || { tail -30 "$RUNNER_TEMP/tempo.txt"; exit 1; }
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/tempo.txt"

      - name: Publicar o resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/publicar" && cd "$RUNNER_TEMP/publicar"
          for f in relatorio.png conferencia.png relatorio.pdf resultado.json validacao.txt; do
            [ -f "$RUNNER_TEMP/saida/$f" ] && cp "$RUNNER_TEMP/saida/$f" "linux-$f"
          done
          for f in "$RUNNER_TEMP/tempo.txt"; do
            [ -f "$f" ] && cp "$f" "linux-$(basename "$f")"
          done
          ls -la
          if ! gh release view teste-volumetria >/dev/null 2>&1; then
            gh release create teste-volumetria --title "Teste da volumetria (automático)" --prerelease --latest=false \
              --notes "Resultado do último teste automático da volumetria em um exame público (voluntário IXI002 do banco IXI, CC BY-SA 3.0, https://brain-development.org/ixi-dataset/). Nenhum dado de paciente. Uso em pesquisa, não validado para diagnóstico."
          fi
          if [ -n "$(ls -A .)" ]; then gh release upload teste-volumetria ./* --clobber; fi

  miniatura:
    # A mesma imagem pequena (um recorte do exame público) segmentada de verdade em Linux e em Mac com
    # Apple Silicon. O servidor Mac do GitHub tem 7 GB de memória e o exame inteiro não cabe nele;
    # o recorte cabe e mostra se as duas máquinas dão os mesmos números.
    if: inputs.onde == 'miniatura' || inputs.onde == 'mac' || inputs.onde == 'ambos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { maquina: ubuntu-latest, nome: linux }
          - { maquina: xcode-27, nome: mac }
    runs-on: ${{ matrix.maquina }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Compilar a biblioteca surfa para Apple Silicon e publicar
        if: matrix.nome == 'mac'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A surfa (licença MIT, do FreeSurfer) só existe em código-fonte. O Mac do usuário não tem
          # compilador, então o projeto publica a versão já compilada, que o instalador baixa.
          sw_vers; uname -m; sysctl -n hw.memsize hw.ncpu
          mkdir -p "$RUNNER_TEMP/roda" && cd "$RUNNER_TEMP/roda"
          curl -fL -sS https://github.com/astral-sh/uv/releases/download/0.13.8/uv-aarch64-apple-darwin.tar.gz -o uv.tar.gz
          echo "6b71028a6b904f2ae3340ef52e595512de807d06c0a20eaef2f692581b246558  uv.tar.gz" | shasum -a 256 -c -
          tar -xzf uv.tar.gz
          UV="$PWD/uv-aarch64-apple-darwin/uv"
          "$UV" venv --quiet --seed --python-preference only-managed --python 3.11 venv
          venv/bin/python -m pip wheel --quiet --no-deps "surfa==0.6.3" -w rodas
          RODA="$(basename rodas/surfa-*.whl)"
          # Nome e soma SHA-256: o instalador confere o arquivo antes de instalar.
          echo "$RODA $(shasum -a 256 "rodas/$RODA" | cut -d' ' -f1)" > rodas/surfa-macos-arm64.txt
          cat rodas/surfa-macos-arm64.txt
          ls -la rodas
          if ! gh release view motor >/dev/null 2>&1; then
            gh release create motor --title "Peças do motor de volumetria" --prerelease --latest=false \
              --notes "Biblioteca surfa 0.6.3 (licença MIT, https://github.com/freesurfer/surfa) compilada para Mac com Apple Silicon e Python 3.11. O instalador da volumetria (mac/instalar-volumetria.sh) baixa daqui, porque a surfa só é distribuída em código-fonte e o Mac sem Xcode não a compila."
          fi
          gh release upload motor rodas/* --clobber

      - name: Instalar o motor de volumetria (no Mac, sem compilador)
        run: |
          export NEUROLAUDO_MOTOR="$RUNNER_TEMP/motor"
          echo "NEUROLAUDO_MOTOR=$NEUROLAUDO_MOTOR" >> "$GITHUB_ENV"
          # Compilador proibido: o instalador tem de funcionar como no Mac do usuário, sem Xcode.
          if [ "${{ matrix.nome }}" = "mac" ]; then export CC=/usr/bin/false CXX=/usr/bin/false; fi
          time NEUROLAUDO_FONTE="$GITHUB_WORKSPACE/engine" bash mac/instalar-volumetria.sh
          du -sh "$NEUROLAUDO_MOTOR"

      - name: Baixar o T1 público e recortar
        run: |
          mkdir -p "$RUNNER_TEMP/ixi" && cd "$RUNNER_TEMP/ixi"
          if [ "${{ matrix.nome }}" = "mac" ]; then PRIMEIRO="-q"; else PRIMEIRO="--occurrence=1"; fi
          curl -sL --max-time 900 http://biomedic.doc.ic.ac.uk/brain-development/downloads/IXI/IXI-T1.tar \
            | tar -xf - $PRIMEIRO "$SUJEITO.nii.gz" || true
          test -s "$SUJEITO.nii.gz"
          "$NEUROLAUDO_MOTOR/venv/bin/python" "$GITHUB_WORKSPACE/engine/scripts/make_crop.py" "$SUJEITO.nii.gz" recorte.nii.gz

      - name: Rodar a volumetria no recorte
        run: |
          if [ "${{ matrix.nome }}" = "mac" ]; then MEDIR="/usr/bin/time -l"; else MEDIR="/usr/bin/time -v"; sudo sysctl -w vm.overcommit_memory=1; fi
          $MEDIR "$NEUROLAUDO_MOTOR/venv/bin/python" -m neurolaudo.volumetry.cli exame \
            --nifti "$RUNNER_TEMP/ixi/recorte.nii.gz" --saida "$RUNNER_TEMP/saida" \
            --idade "$IDADE" --sexo "$SEXO" --nome "Recorte do voluntário público IXI002" --serie "T1 (banco público IXI), recorte" \
            2> "$RUNNER_TEMP/tempo.txt" || { cat "$RUNNER_TEMP/tempo.txt"; tail -40 "$RUNNER_TEMP"/saida/trabalho/registro-*.txt; exit 1; }
          grep -E "Elapsed|Maximum resident|real|maximum resident" "$RUNNER_TEMP/tempo.txt"
          cat "$RUNNER_TEMP/saida/trabalho/volumes.csv"

      - name: Comparar com o mesmo recorte medido em Linux
        run: |
          REFERENCIA=engine/tests/data/ixi002_recorte_volumes.csv
          if [ -f "$REFERENCIA" ]; then
            "$NEUROLAUDO_MOTOR/venv/bin/python" engine/scripts/compare_reference.py \
              "$RUNNER_TEMP/saida/trabalho/volumes.csv" "$REFERENCIA" t1_recortado 0.5 | tee "$RUNNER_TEMP/saida/comparacao.txt"
          else
            echo "Ainda não há referência do recorte no repositório; esta rodada só a produz."
          fi

      - name: Publicar o resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/publicar" && cd "$RUNNER_TEMP/publicar"
          for f in conferencia.png resultado.json comparacao.txt; do
            if [ -f "$RUNNER_TEMP/saida/$f" ]; then cp "$RUNNER_TEMP/saida/$f" "${{ matrix.nome }}-recorte-$f"; fi
          done
          for f in "$RUNNER_TEMP/saida/trabalho/volumes.csv" "$RUNNER_TEMP/tempo.txt" "$RUNNER_TEMP"/saida/trabalho/registro-*.txt; do
            if [ -f "$f" ]; then cp "$f" "${{ matrix.nome }}-recorte-$(basename "$f")"; fi
          done
          ls -la
          # As duas máquinas podem chegar aqui juntas: se a outra criou a versão antes, a criação falha e tudo bem.
          gh release view teste-volumetria >/dev/null 2>&1 || gh release create teste-volumetria \
            --title "Teste da volumetria (automático)" --prerelease --latest=false \
            --notes "Resultado do último teste automático da volumetria em um exame público (banco IXI, CC BY-SA 3.0). Nenhum dado de paciente. Uso em pesquisa, não validado para diagnóstico." || true
          if [ -n "$(ls -A .)" ]; then gh release upload teste-volumetria ./* --clobber; fi

  diagnostico:
    # Mede tempo, memória e números do SynthSeg em várias configurações (um exame público).
    if: inputs.onde == 'diagnostico'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o motor de volumetria
        run: |
          export NEUROLAUDO_MOTOR="$RUNNER_TEMP/motor"
          echo "NEUROLAUDO_MOTOR=$NEUROLAUDO_MOTOR" >> "$GITHUB_ENV"
          NEUROLAUDO_FONTE="$GITHUB_WORKSPACE/engine" bash mac/instalar-volumetria.sh
      - name: Baixar o T1 público
        run: |
          mkdir -p "$RUNNER_TEMP/ixi" && cd "$RUNNER_TEMP/ixi"
          curl -sL --max-time 900 http://biomedic.doc.ic.ac.uk/brain-development/downloads/IXI/IXI-T1.tar \
            | tar -xf - --occurrence=1 "$SUJEITO.nii.gz" || true
          test -s "$SUJEITO.nii.gz"
      - name: Medir
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)" | cut -c1-200
          free -g | head -3
          MEDIR() { "$NEUROLAUDO_MOTOR/venv/bin/python" engine/scripts/diagnose_segmenter.py "$RUNNER_TEMP/ixi/$SUJEITO.nii.gz" \
            engine/tests/data/brainquant_ixi_volumes.csv "$SUJEITO" "$1"; }
          { echo "=== Política de memória padrão do Linux"; MEDIR "$RUNNER_TEMP/diag1"
            sudo sysctl -w vm.overcommit_memory=1 >/dev/null
            echo; echo "=== Com o Linux aceitando qualquer pedido de memória (como faz o macOS)"; MEDIR "$RUNNER_TEMP/diag2"
          } 2>&1 | tee "$RUNNER_TEMP/diagnostico.txt"
      - name: Publicar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f "$RUNNER_TEMP/diagnostico.txt" ]; then
            cp "$RUNNER_TEMP/diagnostico.txt" linux-diagnostico.txt
            lscpu | grep -E "Model name" >> linux-diagnostico.txt
            gh release view teste-volumetria >/dev/null 2>&1 || gh release create teste-volumetria \
              --title "Teste da volumetria (automático)" --prerelease --latest=false \
              --notes "Resultado do último teste automático da volumetria em um exame público (banco IXI, CC BY-SA 3.0). Nenhum dado de paciente. Uso em pesquisa, não validado para diagnóstico." || true
            gh release upload teste-volumetria linux-diagnostico.txt --clobber
          fi
