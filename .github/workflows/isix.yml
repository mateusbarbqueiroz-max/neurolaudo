# Abre o IsiX DICOM Viewer publicado em um servidor Mac do GitHub, com o
# complemento NeuroLaudo instalado e o exame de teste (fantoma), e devolve
# capturas de tela e registros. É o único Mac disponível enquanto o usuário
# não tem um. Acionado à mão: Actions > "Teste dentro do IsiX" > Run workflow.
name: Teste dentro do IsiX (macOS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teste:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      SAIDA: ${{ github.workspace }}/saida
    steps:
      - uses: actions/checkout@v4

      - name: Preparar
        run: |
          mkdir -p "$SAIDA"
          sw_vers
          # Auxiliares de tela: aceitar avisos do macOS e listar as janelas do IsiX.
          cat > "$RUNNER_TEMP/ui.sh" <<'FIM'
          permitir() {
            /usr/bin/osascript 2>&1 <<'EOF' || true
          tell application "System Events"
            set achados to {}
            repeat with p in (every process)
              try
                repeat with w in (every window of p)
                  repeat with nome in {"Allow", "Permitir", "OK"}
                    try
                      if exists (button (nome as text) of w) then
                        if (name of p as text) is not "IsiX DICOM Viewer" then
                          click button (nome as text) of w
                          set end of achados to ((name of p as text) & ": " & (nome as text))
                        end if
                      end if
                    end try
                  end repeat
                end repeat
              end try
            end repeat
            return achados
          end tell
          EOF
          }
          janelas() {
            /usr/bin/osascript 2>&1 <<'EOF' || true
          tell application "System Events"
            if not (exists process "IsiX DICOM Viewer") then return "processo do IsiX não encontrado"
            tell process "IsiX DICOM Viewer"
              set saida to "janelas do IsiX: " & (count of windows) & linefeed
              repeat with w in windows
                set saida to saida & "- " & (name of w as text) & linefeed
                try
                  set saida to saida & "    textos: " & (value of every static text of w as text) & linefeed
                end try
                try
                  set saida to saida & "    botões: " & (name of every button of w as text) & linefeed
                end try
                try
                  repeat with s in (sheets of w)
                    set saida to saida & "    folha, textos: " & (value of every static text of s as text) & linefeed
                    set saida to saida & "    folha, botões: " & (name of every button of s as text) & linefeed
                  end repeat
                end try
              end repeat
              return saida
            end tell
          end tell
          EOF
          }
          # Clica em um botão de uma janela (ou folha) do próprio IsiX.
          clicar_isix() {
            /usr/bin/osascript - "$1" 2>&1 <<'EOF' || true
          on run argv
            set alvo to item 1 of argv
            tell application "System Events"
              tell process "IsiX DICOM Viewer"
                repeat with w in windows
                  try
                    if exists (button alvo of w) then
                      click button alvo of w
                      return "clicado: " & alvo
                    end if
                  end try
                  try
                    repeat with s in (sheets of w)
                      if exists (button alvo of s) then
                        click button alvo of s
                        return "clicado na folha: " & alvo
                      end if
                    end repeat
                  end try
                end repeat
              end tell
            end tell
            return "botão não encontrado: " & alvo
          end run
          EOF
          }
          # Lista os itens do menu Plugins (prova de que os comandos apareceram) e do menu Window.
          menus() {
            /usr/bin/osascript 2>&1 <<'EOF' || true
          set AppleScript's text item delimiters to " | "
          tell application "System Events"
            tell process "IsiX DICOM Viewer"
              set saida to ""
              tell menu bar 1
                try
                  set saida to saida & "menu Window: " & (name of every menu item of menu "Window" as text) & linefeed
                end try
                tell menu "Plugins"
                  repeat with mi in menu items
                    set saida to saida & "menu Plugins > " & (name of mi as text)
                    try
                      set saida to saida & ": " & (name of every menu item of menu 1 of mi as text)
                    end try
                    set saida to saida & linefeed
                  end repeat
                end tell
              end tell
              return saida
            end tell
          end tell
          EOF
          }
          # Clica em um item de menu do IsiX: menu_clicar "Window" "Tile 2D Viewer Windows".
          menu_clicar() {
            /usr/bin/osascript - "$1" "$2" 2>&1 <<'EOF' || true
          on run argv
            tell application "System Events"
              tell process "IsiX DICOM Viewer"
                click menu item (item 2 of argv) of menu (item 1 of argv) of menu bar 1
              end tell
            end tell
            return "menu: " & (item 1 of argv) & " > " & (item 2 of argv)
          end run
          EOF
          }
          # Clica em um comando do menu Plugins: plugin_clicar "Database" "Comparar com exame anterior".
          plugin_clicar() {
            /usr/bin/osascript - "$1" "$2" 2>&1 <<'EOF' || true
          on run argv
            tell application "System Events"
              tell process "IsiX DICOM Viewer"
                click menu item (item 2 of argv) of menu 1 of menu item (item 1 of argv) of menu "Plugins" of menu bar 1
              end tell
            end tell
            return "plugins: " & (item 1 of argv) & " > " & (item 2 of argv)
          end run
          EOF
          }
          # Todas as janelas do IsiX que o macOS conhece, visíveis ou não, com posição e tamanho.
          diag() {
            /usr/bin/swift "$RUNNER_TEMP/diag.swift" 2>&1 | head -40 || true
          }
          FIM
          cat > "$RUNNER_TEMP/diag.swift" <<'FIM'
          import CoreGraphics
          import Foundation
          let todas = CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]] ?? []
          var n = 0
          for w in todas where (w[kCGWindowOwnerName as String] as? String) == "IsiX DICOM Viewer" {
              n += 1
              let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
              print("janela CG: nome=\(w[kCGWindowName as String] ?? "-") camada=\(w[kCGWindowLayer as String] ?? "?") naTela=\(w[kCGWindowIsOnscreen as String] ?? 0) alfa=\(w[kCGWindowAlpha as String] ?? "?") x=\(b["X"] ?? "?") y=\(b["Y"] ?? "?") larg=\(b["Width"] ?? "?") alt=\(b["Height"] ?? "?")")
          }
          print("janelas CG do IsiX: \(n)")
          FIM
          sed -i '' 's/^          //' "$RUNNER_TEMP/ui.sh"
          bash -n "$RUNNER_TEMP/ui.sh" && echo "auxiliares de tela: ok"

      - name: Baixar o IsiX publicado (Apple Silicon)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=ThalesMMS/IsiX-DICOM-Viewer-macOS
          gh api "repos/$REPO/releases/latest" --jq '.tag_name' | tee "$SAIDA/isix-versao.txt"
          NOME="$(gh api "repos/$REPO/releases/latest" --jq '[.assets[].name | select(test("apple.?silicon|arm64"; "i")) | select(endswith(".zip")) | select(test("dsym|sdk|symbols"; "i") | not)] | first')"
          echo "Arquivo escolhido: $NOME"
          mkdir -p "$RUNNER_TEMP/isix"
          gh release download --repo "$REPO" --pattern "$NOME" --dir "$RUNNER_TEMP/isix"
          ditto -x -k "$RUNNER_TEMP/isix/$NOME" "$RUNNER_TEMP/isix/aberto"
          APP="$(find "$RUNNER_TEMP/isix/aberto" -maxdepth 3 -name '*.app' | head -1)"
          echo "APP=$APP" >> "$GITHUB_ENV"
          codesign --verify --deep --strict "$APP" && echo "assinatura do IsiX: ok"
          spctl --assess --type execute -vv "$APP" || true

      - name: Instalar o complemento com mac/instalar.sh
        run: bash mac/instalar.sh

      - name: Script do botão do PACS (mac/botao-pacs.sh)
        run: |
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$APP" || true
          bash mac/botao-pacs.sh isix || echo "falhou: isix"
          bash mac/botao-pacs.sh ver || echo "falhou: ver"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar o exame de teste (fantoma)
        run: |
          python -m pip install --quiet numpy pydicom pynetdicom
          python engine/scripts/make_phantom.py "$RUNNER_TEMP/fantoma"
          python engine/scripts/make_phantom.py --rm "$RUNNER_TEMP/rm"
          python engine/scripts/make_phantom.py --t1 "$RUNNER_TEMP/t1"
          # Um exame de RM que só o PACS de teste tem: é ele que o link do botão do PACS vai buscar.
          python engine/scripts/make_phantom.py --rm "$RUNNER_TEMP/pacs"
          echo "PACS_ESTUDO=$(python -c "import glob, pydicom; print(pydicom.dcmread(sorted(glob.glob('$RUNNER_TEMP/pacs/atual/01/*.dcm'))[0]).StudyInstanceUID)")" >> "$GITHUB_ENV"
          ls "$RUNNER_TEMP/fantoma" | wc -l

      - name: PACS de teste (faz o papel do PACS do hospital)
        run: |
          nohup python engine/scripts/fake_pacs.py "$RUNNER_TEMP/pacs/atual" --ae PACSFALSO --porta 11112 \
            --destino ISIXTESTE=127.0.0.1:11113 > "$SAIDA/pacs-de-teste.txt" 2>&1 &
          sleep 5
          cat "$SAIDA/pacs-de-teste.txt"

      - name: Motor de volumetria de mentira (testa o caminho do complemento, não a segmentação)
        run: |
          # O motor de verdade (TensorFlow e modelos) é testado em volumetria.yml. Aqui o Python e o motor
          # do NeuroLaudo são os de verdade; só os dois programas de segmentação são trocados por imitações.
          MOTOR="$RUNNER_TEMP/motor"
          python -m venv "$MOTOR/venv"
          "$MOTOR/venv/bin/python" -m pip install --quiet ./engine
          "$MOTOR/venv/bin/python" engine/tests/fakes/make_fake_engine.py "$MOTOR"
          NEUROLAUDO_MOTOR="$MOTOR" "$MOTOR/venv/bin/python" -m neurolaudo.volumetry.cli verificar

      - name: Abrir o IsiX
        run: |
          source "$RUNNER_TEMP/ui.sh"
          RAIZ="$RUNNER_TEMP/banco"
          mkdir -p "$RAIZ"
          EXE="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          "$EXE" -hideListenerError YES -moveToApplicationsFolderAlertSuppress YES \
            -DATABASELOCATION 1 -DATABASELOCATIONURL "$RAIZ" -DEFAULT_DATABASELOCATION 1 -DEFAULT_DATABASELOCATIONURL "$RAIZ" \
            -AUTOCLEANINGSPACE NO -AUTOCLEANINGDATE NO -AUTOROUTINGACTIVATED NO \
            -STORESCP YES -AETITLE ISIXTESTE -AEPORT 11113 \
            -SERVERS '({Activated = 1; AETitle = PACSFALSO; Address = "127.0.0.1"; Port = 11112; Description = "PACS de teste"; QR = 1; Send = 1; retrieveMode = 0; TransferSyntax = 0;})' \
            -publishDICOMBonjour NO -searchDICOMBonjour NO \
            -checkForUpdatesPlugins NO -SUEnableAutomaticChecks NO -httpXMLRPCServer YES -httpXMLRPCServerAccessScope 0 \
            -NeuroLaudoAutoteste YES -NeuroLaudoMotor "$RUNNER_TEMP/motor" \
            > "$SAIDA/isix-saida.txt" 2>&1 &
          sleep 30
          pgrep -fl "IsiX DICOM Viewer.app/Contents/MacOS/" | cut -c1-80 || echo "O IsiX não está rodando"
          echo "avisos aceitos: $(permitir)"
          sleep 5
          open -a "$APP" || true
          sleep 10
          janelas
          menus
          screencapture -x "$SAIDA/1-aberto.png" || echo "captura falhou"

      - name: Importar o exame de teste (o complemento deve abri-lo sozinho)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          # Grava a tela daqui até o fim do teste: vídeo para o usuário ver o programa rodando (só o fantoma).
          nohup screencapture -x -k -V 660 "$RUNNER_TEMP/sessao.mov" > "$SAIDA/gravacao.txt" 2>&1 &
          sleep 3
          open -a "$APP" "$RUNNER_TEMP/fantoma" || echo "open falhou"
          sleep 15
          echo "avisos aceitos: $(permitir)"
          clicar_isix "Copy Links"
          sleep 35
          menu_clicar "Window" "Tile 2D Viewer Windows"
          sleep 5
          janelas
          screencapture -x "$SAIDA/2-importado.png" || echo "captura falhou"

      - name: Janela de osso pelo atalho do complemento (⌃⌥4)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          /usr/bin/osascript -e 'tell application "IsiX DICOM Viewer" to activate' || true
          sleep 2
          /usr/bin/osascript -e 'tell application "System Events" to key code 21 using {control down, option down}' || echo "tecla falhou"
          sleep 5
          janelas
          screencapture -x "$SAIDA/3-osso.png" || echo "captura falhou"

      - name: Autoteste das medidas dentro do IsiX (linhas desenhadas pelo complemento)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          /usr/bin/osascript -e 'tell application "IsiX DICOM Viewer" to activate' || true
          sleep 2
          plugin_clicar "Others" "NeuroLaudo: autoteste"
          sleep 8
          log show --last 2m --style compact --predicate 'subsystem == "app.neurolaudo.isixplugin"' 2>/dev/null | grep "autoteste" || echo "sem linhas de autoteste no registro"

      - name: RM com exame anterior (protocolo de neuro ao chegar)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          menu_clicar "Window" "Close All Viewers"
          sleep 3
          open -a "$APP" "$RUNNER_TEMP/rm/anterior" || echo "open falhou"
          sleep 15
          clicar_isix "Copy Links"
          sleep 30
          menu_clicar "Window" "Close All Viewers"
          sleep 3
          open -a "$APP" "$RUNNER_TEMP/rm/atual" || echo "open falhou"
          sleep 15
          clicar_isix "Copy Links"
          sleep 35
          menu_clicar "Window" "Tile 2D Viewer Windows"
          sleep 6
          janelas
          screencapture -x "$SAIDA/4-rm-protocolo.png" || echo "captura falhou"

      - name: Comparar com exame anterior
        run: |
          source "$RUNNER_TEMP/ui.sh"
          /usr/bin/osascript -e 'tell application "IsiX DICOM Viewer" to activate' || true
          sleep 2
          plugin_clicar "Database" "Comparar com exame anterior"
          sleep 12
          menu_clicar "Window" "Tile 2D Viewer Windows"
          sleep 6
          janelas
          screencapture -x "$SAIDA/5-rm-comparacao.png" || echo "captura falhou"

      - name: Volumetria dentro do IsiX (fantoma de T1 volumétrico)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          REGISTRO() { log show --last 6m --style compact --predicate 'subsystem == "app.neurolaudo.isixplugin"' 2>/dev/null | grep "volumetria" || true; }
          menu_clicar "Window" "Close All Viewers"
          sleep 3
          open -a "$APP" "$RUNNER_TEMP/t1" || echo "open falhou"
          sleep 15
          clicar_isix "Copy Links"
          sleep 30
          # No servidor as janelas só passam a existir na tela depois deste comando; sem janela de
          # imagem ativa o comando do complemento não tem em que série trabalhar.
          menu_clicar "Window" "Tile 2D Viewer Windows"
          sleep 6
          janelas
          /usr/bin/osascript -e 'tell application "IsiX DICOM Viewer" to activate' || true
          sleep 2
          # Leva o T1 ao corte do meio: o mapa abre no mesmo corte, e a captura mostra as cores.
          plugin_clicar "Others" "NeuroLaudo: corte do meio"
          sleep 2
          plugin_clicar "Image Filters" "Volumetria cerebral (pesquisa)…"
          # Espera o fim (linha "concluída" ou "não concluída" no registro), até 4 minutos.
          for i in $(seq 1 48); do
            if REGISTRO | grep -q "concluída"; then break; fi
            sleep 5
          done
          sleep 4
          REGISTRO
          screencapture -x "$SAIDA/6-volumetria-resumo.png" || echo "captura falhou"
          clicar_isix "Fechar"
          sleep 3
          menu_clicar "Window" "Tile 2D Viewer Windows"
          sleep 6
          janelas
          screencapture -x "$SAIDA/7-volumetria-mapa.png" || echo "captura falhou"
          REGISTRO | grep -q "volumetria: concluída" && echo "VOLUMETRIA NO ISIX: OK" || echo "VOLUMETRIA NO ISIX: NÃO CONCLUÍDA"

      - name: Botão do PACS simulado (link no formato do PACS do hospital)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          menu_clicar "Window" "Close All Viewers"
          sleep 3
          # Como o do hospital: ServerName com maiúscula, valores entre aspas, retrieveOnlyIfNeeded e then=Open.
          # O nome do servidor é o AE title do PACS de teste; no IsiX a descrição dele é outra.
          LINK="osirix://?methodName='Retrieve'&retrieveOnlyIfNeeded='yes'&ServerName='PACSFALSO'&filterKey='StudyInstanceUID'&filterValue='$PACS_ESTUDO'&then=Open"
          echo "$LINK"
          open "$LINK" || echo "open falhou"
          sleep 5
          echo "avisos aceitos: $(permitir)"
          for i in $(seq 1 24); do
            if grep -q "C-MOVE" "$SAIDA/pacs-de-teste.txt"; then break; fi
            sleep 5
          done
          sleep 30
          menu_clicar "Window" "Tile 2D Viewer Windows"
          sleep 6
          janelas
          screencapture -x "$SAIDA/8-pacs-primeiro-clique.png" || echo "captura falhou"
          ANTES=$(grep -c "C-MOVE" "$SAIDA/pacs-de-teste.txt" || true)
          # Segundo clique no mesmo exame: ele já está completo no Mac e não deve ser buscado de novo.
          open "$LINK" || echo "open falhou"
          sleep 25
          DEPOIS=$(grep -c "C-MOVE" "$SAIDA/pacs-de-teste.txt" || true)
          janelas
          screencapture -x "$SAIDA/9-pacs-segundo-clique.png" || echo "captura falhou"
          echo "--- PACS de teste:"; cat "$SAIDA/pacs-de-teste.txt"
          echo "BUSCAS NO PACS: depois do primeiro clique $ANTES, depois do segundo $DEPOIS"
          log show --last 3m --style compact --predicate 'subsystem == "app.neurolaudo.isixplugin"' 2>/dev/null | grep -i "exame recebido" || echo "complemento: nada sobre exame recebido"

      - name: Nomes das séries (lista para ensinar o NeuroLaudo)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          /usr/bin/osascript -e 'tell application "IsiX DICOM Viewer" to activate' || true
          sleep 2
          plugin_clicar "Database" "Nomes das séries (para ensinar o NeuroLaudo)"
          sleep 6
          screencapture -x "$SAIDA/10-nomes-das-series.png" || echo "captura falhou"
          clicar_isix "Fechar"
          log show --last 2m --style compact --predicate 'subsystem == "app.neurolaudo.isixplugin"' 2>/dev/null | grep "nomes das séries" || echo "complemento: nada sobre nomes das séries"

      - name: Vídeo do teste (trechos parados encurtados)
        if: always()
        run: |
          for i in $(seq 1 150); do pgrep -x screencapture >/dev/null || break; sleep 5; done
          if [ ! -s "$RUNNER_TEMP/sessao.mov" ]; then echo "sem gravação"; cat "$SAIDA/gravacao.txt" || true; exit 0; fi
          ls -la "$RUNNER_TEMP/sessao.mov"
          command -v ffmpeg >/dev/null || brew install --quiet ffmpeg >/dev/null 2>&1 || true
          # mpdecimate tira os quadros repetidos (esperas); max=8 deixa os trechos parados ~9 vezes mais curtos, sem sumir.
          ffmpeg -hide_banner -loglevel error -y -i "$RUNNER_TEMP/sessao.mov" \
            -vf "fps=10,scale=1280:-2,mpdecimate=max=8,setpts=N/10/TB" -an \
            -c:v libx264 -crf 30 -preset veryfast -pix_fmt yuv420p -movflags +faststart \
            "$SAIDA/video-do-teste.mp4" || echo "conversão falhou"
          ls -la "$SAIDA/video-do-teste.mp4" 2>/dev/null || true
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$SAIDA/video-do-teste.mp4" 2>/dev/null || true

      - name: Registros
        if: always()
        run: |
          log show --last 20m --style compact --predicate 'subsystem == "app.neurolaudo.isixplugin"' > "$SAIDA/registro-neurolaudo.txt" 2>&1 || true
          log show --last 20m --style compact --predicate 'process == "IsiX DICOM Viewer"' 2>/dev/null | grep -iE "plugin|neurolaudo|horos URL|exception|xmlrpc|retrieve|link scheme|listener" | tail -150 > "$SAIDA/registro-isix.txt" || true
          echo "--- NeuroLaudo:"; tail -40 "$SAIDA/registro-neurolaudo.txt"
          echo "--- saída do IsiX (fim):"; tail -30 "$SAIDA/isix-saida.txt" || true
          echo "--- porta de comandos:"; grep -i "XML-RPC interface" "$SAIDA/isix-saida.txt" || echo "linha não encontrada"
          echo "--- versão do IsiX:"; /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" || true
          echo "--- IsiX, links e buscas:"; grep -iE "xmlrpc|retrieve|link scheme" "$SAIDA/registro-isix.txt" | tail -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-no-isix
          path: saida

      # As capturas e os registros também vão para uma versão de teste, de onde
      # a sessão em nuvem consegue baixá-los (ela não alcança os artefatos).
      - name: Publicar capturas e registros
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$SAIDA"
          if ! gh release view teste-isix >/dev/null 2>&1; then
            gh release create teste-isix --title "Teste dentro do IsiX (automático)" --prerelease --latest=false \
              --notes "Capturas de tela e registros do último teste automático no servidor Mac. Só o exame de teste (fantoma); nenhum dado de paciente."
          fi
          gh release upload teste-isix ./* --clobber
