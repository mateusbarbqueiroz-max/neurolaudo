name: Lesões no FLAIR (estudo)

# Estudo de viabilidade da medida de lesões de substância branca no FLAIR, com o WMH-SynthSeg do
# FreeSurfer 8.2 (rede neural em PyTorch). Mede tempo e memória em Linux e no Mac (Apple Silicon) em
# FLAIR 3D públicos do ON-Harmony (OpenNeuro ds004712, CC0). O programa original passou de 16 GB em Linux;
# aqui roda a versão por fatias (engine/scripts/wmh_lowmem.py), conferida antes contra a rede original em
# volumes pequenos. Nenhum dado de paciente. Acionado à mão. Uso em pesquisa.

on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "viabilidade (2 exames) ou repeticao (20 voluntários em vários aparelhos)"
        default: "viabilidade"
      onde:
        description: "viabilidade: linux, mac ou ambos"
        default: "ambos"

permissions:
  contents: write

env:
  FS_RAW: https://raw.githubusercontent.com/freesurfer/freesurfer/v8.2.0/mri_WMHsynthseg/WMHSynthSeg
  MODELO: https://ftp.nmr.mgh.harvard.edu/pub/dist/lcnpublic/dist/WMH-SynthSeg/WMH-SynthSeg_v10_231110.pth
  S3: https://s3.amazonaws.com/openneuro.org/ds004712
  TORCH: "2.5.1"
  # FLAIR 3D de um voluntário em dois aparelhos (Siemens Prisma e GE).
  FLAIRS: >-
    sub-13192/ses-OXF1PRI001/anat/sub-13192_ses-OXF1PRI001_T2w.nii.gz
    sub-13192/ses-NOT3GEM001/anat/sub-13192_ses-NOT3GEM001_FLAIR.nii.gz

jobs:
  viabilidade:
    if: inputs.etapa != 'repeticao'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { maquina: ubuntu-latest, nome: linux }
          - { maquina: xcode-27, nome: mac }
    runs-on: ${{ matrix.maquina }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar o PyTorch e o WMH-SynthSeg
        if: inputs.onde == 'ambos' || inputs.onde == matrix.nome
        run: |
          mkdir -p "$RUNNER_TEMP/saida"
          if [ "${{ matrix.nome }}" = "linux" ]; then
            python -m pip install --quiet "torch==$TORCH" --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install --quiet "torch==$TORCH"
          fi
          python -m pip install --quiet "numpy<2" nibabel scipy h5py matplotlib
          W="$RUNNER_TEMP/wmh"
          mkdir -p "$W/unet3d" "$W/fs/models"
          for f in inference.py utils.py unet3d/__init__.py unet3d/model.py unet3d/buildingblocks.py unet3d/se.py unet3d/utils.py; do
            curl -fsSL --retry 3 -o "$W/$f" "$FS_RAW/$f"
          done
          curl -fsSL --retry 3 -o "$W/fs/models/WMH-SynthSeg_v10_231110.pth" "$MODELO"
          ls -la "$W/fs/models"
          { python -c "import torch; print('torch', torch.__version__, 'núcleos', torch.get_num_threads())"
            shasum -a 256 "$W/fs/models/WMH-SynthSeg_v10_231110.pth"
            wc -c < "$W/fs/models/WMH-SynthSeg_v10_231110.pth"
          } | tee "$RUNNER_TEMP/saida/${{ matrix.nome }}-instalacao.txt"

      - name: Baixar os FLAIR públicos
        if: inputs.onde == 'ambos' || inputs.onde == matrix.nome
        run: |
          mkdir -p "$RUNNER_TEMP/flair"
          for f in $FLAIRS; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/flair/$(basename "$f")" "$S3/$f"
          done
          ls -la "$RUNNER_TEMP/flair"

      - name: Conferir a versão por fatias contra a rede original
        if: inputs.onde == 'ambos' || inputs.onde == matrix.nome
        run: |
          python engine/scripts/wmh_lowmem.py --codigo "$RUNNER_TEMP/wmh" \
            --modelo "$RUNNER_TEMP/wmh/fs/models/WMH-SynthSeg_v10_231110.pth" --conferir \
            | tee "$RUNNER_TEMP/saida/${{ matrix.nome }}-conferencia.txt"

      - name: Segmentar as lesões (versão por fatias)
        if: inputs.onde == 'ambos' || inputs.onde == matrix.nome
        timeout-minutes: 100
        run: |
          if [ "${{ matrix.nome }}" = "mac" ]; then MEDIR="/usr/bin/time -l"; else MEDIR="/usr/bin/time -v"; fi
          for f in "$RUNNER_TEMP"/flair/*.nii.gz; do
            n="${{ matrix.nome }}-$(basename "$f" .nii.gz)"
            echo "=== $n"
            $MEDIR python engine/scripts/wmh_lowmem.py --codigo "$RUNNER_TEMP/wmh" \
              --modelo "$RUNNER_TEMP/wmh/fs/models/WMH-SynthSeg_v10_231110.pth" \
              --i "$f" --o "$RUNNER_TEMP/saida/$n-seg.nii.gz" --csv "$RUNNER_TEMP/saida/$n-volumes.csv" \
              --figura "$RUNNER_TEMP/saida/$n-lesoes.png" \
              > "$RUNNER_TEMP/saida/$n-registro.txt" 2>&1 || echo "falhou"
            grep -E "lesões|torch |Elapsed|Maximum resident|real |maximum resident|Error|error|Killed" "$RUNNER_TEMP/saida/$n-registro.txt" | tail -8
          done

      - name: Publicar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/saida" || exit 0
          rm -f ./*-seg.nii.gz
          find . -maxdepth 1 -type f -empty -delete
          ls -la
          gh release view teste-lesoes >/dev/null 2>&1 || gh release create teste-lesoes --title "Teste das lesões no FLAIR (automático)" \
            --prerelease --latest=false --notes "Estudo de viabilidade da medida de lesões de substância branca no FLAIR, em exames públicos (ON-Harmony, CC0). Nenhum dado de paciente. Uso em pesquisa." || true
          if [ -n "$(ls -A .)" ]; then gh release upload teste-lesoes ./* --clobber; fi

  repeticao:
    # Repetição do volume de lesões: ON-Harmony, 20 voluntários em 6 aparelhos de 3 T e 10 deles mais 5 vezes no
    # mesmo aparelho. Uma pessoa por servidor; o FLAIR 3D se chama T2w ou FLAIR conforme o aparelho.
    if: inputs.etapa == 'repeticao'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        pessoa: ["03286", "03997", "10975", "12813", "13192", "13305", "14221", "14229", "14230", "14482",
                 "15320", "16745", "16766", "16793", "16794", "16841", "16842", "16974", "16975", "16981"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar o PyTorch e o WMH-SynthSeg
        run: |
          python -m pip install --quiet "torch==$TORCH" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet "numpy<2" nibabel scipy h5py matplotlib
          W="$RUNNER_TEMP/wmh"
          mkdir -p "$W/unet3d" "$W/fs/models"
          for f in inference.py utils.py unet3d/__init__.py unet3d/model.py unet3d/buildingblocks.py unet3d/se.py unet3d/utils.py; do
            curl -fsSL --retry 3 -o "$W/$f" "$FS_RAW/$f"
          done
          curl -fsSL --retry 3 -o "$W/fs/models/WMH-SynthSeg_v10_231110.pth" "$MODELO"
      - name: Medir cada sessão
        run: |
          P="sub-${{ matrix.pessoa }}"
          mkdir -p "$RUNNER_TEMP/saida" "$RUNNER_TEMP/flair"
          for SES in $(curl -fsS --retry 3 "https://s3.amazonaws.com/openneuro.org?list-type=2&prefix=ds004712/$P/ses-&delimiter=/" \
                       | grep -o "<Prefix>ds004712/$P/ses-[^<]*" | sed "s#.*/ses-##; s#/##"); do
            F=""
            for NOME in T2w FLAIR; do
              if curl -fsSL --retry 3 -o "$RUNNER_TEMP/flair/$SES.nii.gz" "$S3/$P/ses-$SES/anat/${P}_ses-${SES}_${NOME}.nii.gz" 2>/dev/null; then
                F="$NOME"; break
              fi
            done
            if [ -z "$F" ]; then echo "$SES: sem FLAIR"; continue; fi
            DESC="$(curl -fsS --retry 3 "$S3/$P/ses-$SES/anat/${P}_ses-${SES}_${F}.json" \
                    | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('SeriesDescription'), 'TI', d.get('InversionTime'))" || echo "?")"
            if python engine/scripts/wmh_lowmem.py --codigo "$RUNNER_TEMP/wmh" \
                 --modelo "$RUNNER_TEMP/wmh/fs/models/WMH-SynthSeg_v10_231110.pth" --threads 4 \
                 --i "$RUNNER_TEMP/flair/$SES.nii.gz" --o "$RUNNER_TEMP/seg.nii.gz" --json "$RUNNER_TEMP/um.json" \
                 > "$RUNNER_TEMP/registro.txt" 2>&1; then
              python -c "import json,sys; d=json.load(open(sys.argv[1])); s=sys.argv[3]; d.update(sujeito=sys.argv[2], sessao=s, aparelho=s[:-3], repeticao=s[-3:], serie=sys.argv[4]); json.dump(d, open(sys.argv[5], 'w'))" \
                "$RUNNER_TEMP/um.json" "${{ matrix.pessoa }}" "$SES" "$DESC" "$RUNNER_TEMP/saida/${{ matrix.pessoa }}_$SES.json"
              echo "$SES ($DESC): $(grep -E '^lesões \(WMH\)' "$RUNNER_TEMP/registro.txt")"
            else
              echo "$SES: falhou"; tail -5 "$RUNNER_TEMP/registro.txt"
            fi
            rm -f "$RUNNER_TEMP/flair/$SES.nii.gz"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesoes-${{ matrix.pessoa }}
          path: ${{ runner.temp }}/saida/*.json
          if-no-files-found: warn

  repeticao-resumo:
    if: always() && inputs.etapa == 'repeticao'
    needs: repeticao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lesoes-*
          path: ${{ runner.temp }}/medidas
          merge-multiple: true
      - name: Resumir
        run: python3 engine/scripts/lesion_retest_summary.py "$RUNNER_TEMP/medidas" "$RUNNER_TEMP/resumo"
      - name: Publicar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -d "$RUNNER_TEMP/resumo" || exit 1
          cd "$RUNNER_TEMP/resumo"
          gh release view teste-lesoes >/dev/null 2>&1 || gh release create teste-lesoes --title "Teste das lesões no FLAIR (automático)" \
            --prerelease --latest=false --notes "Lesões de substância branca no FLAIR em exames públicos (ON-Harmony, CC0). Nenhum dado de paciente. Uso em pesquisa." || true
          find . -maxdepth 1 -type f -empty -delete
          gh release upload teste-lesoes ./* --clobber
