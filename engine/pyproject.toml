[project]
name = "neurolaudo"
version = "0.1.0"
description = "Motor de análise para neurorradiologia: leitura DICOM, volumetria e relatórios"
requires-python = ">=3.10"
dependencies = ["pydicom>=2.4", "numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
neurolaudo-volumetria = "neurolaudo.volumetry.cli:main"

[tool.setuptools.package-data]
"neurolaudo.volumetry" = ["data/*.json", "data/*.md"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neurolaudo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
